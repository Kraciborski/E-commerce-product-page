<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | E-commerce product page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="navbar__left">
      <button class="menu-toggle" id="menuOpen" aria-label="Open menu">
        <img src="./images/icon-menu.svg" alt="" aria-hidden="true">
      </button>
      <a href="#" class="logo">
        <img src="./images/logo.svg" alt="Sneakers">
      </a>
      <nav class="nav-links" id="navLinks">
        <button class="menu-close" id="menuClose" aria-label="Close menu">
          <img src="./images/icon-close.svg" alt="" aria-hidden="true">
        </button>
        <a href="#" class="nav-links__link">Collections</a>
        <a href="#" class="nav-links__link">Men</a>
        <a href="#" class="nav-links__link">Women</a>
        <a href="#" class="nav-links__link">About</a>
        <a href="#" class="nav-links__link">Contact</a>
      </nav>
    </div>
    
    <div class="navbar__right">
      <button class="cart-toggle" id="cartToggle" aria-label="View cart">
        <img src="./images/icon-cart.svg" alt="" aria-hidden="true">
        <span class="cart-badge" id="cartBadge">0</span>
      </button>
      <button class="avatar" aria-label="Account profile">
        <img src="./images/image-avatar.png" alt="">
      </button>
    </div>

    <div class="cart-dropdown" id="cartDropdown">
      <div class="cart-dropdown__header">Cart</div>
      <div class="cart-dropdown__content" id="cartContent">
        <p class="cart-empty">Your cart is empty.</p>
      </div>
    </div>
  </header>

  <div class="menu-overlay" id="menuOverlay"></div>

  <main class="product-container">
    <section class="gallery">
      <div class="gallery__main-container">
        <button class="gallery__nav gallery__nav--prev" id="mobilePrev" aria-label="Previous image">
          <img src="./images/icon-previous.svg" alt="" aria-hidden="true">
        </button>
        <img src="./images/image-product-1.jpg" alt="Fall Limited Edition Sneakers" class="gallery__main" id="mainImg">
        <button class="gallery__nav gallery__nav--next" id="mobileNext" aria-label="Next image">
          <img src="./images/icon-next.svg" alt="" aria-hidden="true">
        </button>
      </div>
      <div class="gallery__thumbnails">
        <button class="thumbnail-btn active" data-index="1">
          <img src="./images/image-product-1-thumbnail.jpg" alt="">
        </button>
        <button class="thumbnail-btn" data-index="2">
          <img src="./images/image-product-2-thumbnail.jpg" alt="">
        </button>
        <button class="thumbnail-btn" data-index="3">
          <img src="./images/image-product-3-thumbnail.jpg" alt="">
        </button>
        <button class="thumbnail-btn" data-index="4">
          <img src="./images/image-product-4-thumbnail.jpg" alt="">
        </button>
      </div>
    </section>

    <section class="details">
      <span class="details__company">Sneaker Company</span>
      <h1 class="details__title">Fall Limited Edition Sneakers</h1>
      <p class="details__description">
        These low-profile sneakers are your perfect casual wear companion. Featuring a durable rubber outer sole, they’ll withstand everything the weather can offer.
      </p>
      
      <div class="price-box">
        <div class="price-box__current">
          <span class="current-price">$125.00</span>
          <span class="discount">50%</span>
        </div>
        <span class="original-price">$250.00</span>
      </div>

      <div class="actions">
        <div class="quantity-selector">
          <button id="qtyMinus" aria-label="Decrease quantity">
            <img src="./images/icon-minus.svg" alt="" aria-hidden="true">
          </button>
          <span id="qtyValue">0</span>
          <button id="qtyPlus" aria-label="Increase quantity">
            <img src="./images/icon-plus.svg" alt="" aria-hidden="true">
          </button>
        </div>
        <button class="add-to-cart-btn" id="addToCart">
          <img src="./images/icon-cart-white.svg" alt="" aria-hidden="true" class="btn-icon">
          Add to cart
        </button>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox">
    <div class="lightbox__content">
      <button class="lightbox__close" id="lightboxClose" aria-label="Close gallery">
        <svg width="14" height="15" xmlns="http://www.w3.org/2000/svg"><path d="m11.596.782 2.122 2.122L9.12 7.499l4.597 4.597-2.122 2.122L7 9.62l-4.595 4.597-2.122-2.122L4.878 7.5.282 2.904 2.404.782 7 5.38 11.596.782Z" fill="#FFF" fill-rule="evenodd"/></svg>
      </button>
      <div class="lightbox__main-container">
        <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" aria-label="Previous image">
          <img src="./images/icon-previous.svg" alt="" aria-hidden="true">
        </button>
        <img src="./images/image-product-1.jpg" alt="" class="lightbox__main" id="lightboxMainImg">
        <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" aria-label="Next image">
          <img src="./images/icon-next.svg" alt="" aria-hidden="true">
        </button>
      </div>
      <div class="lightbox__thumbnails">
        <button class="lightbox-thumb active" data-index="1">
          <img src="./images/image-product-1-thumbnail.jpg" alt="">
        </button>
        <button class="lightbox-thumb" data-index="2">
          <img src="./images/image-product-2-thumbnail.jpg" alt="">
        </button>
        <button class="lightbox-thumb" data-index="3">
          <img src="./images/image-product-3-thumbnail.jpg" alt="">
        </button>
        <button class="lightbox-thumb" data-index="4">
          <img src="./images/image-product-4-thumbnail.jpg" alt="">
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
